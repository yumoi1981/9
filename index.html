<!DOCTYPE html>

<head>
<meta charset="utf-8">

<title>その頃、世界では</title>
<style>
:root{--paper:#f3ecdc;--card:#fbf6ea;--ink:#2a2521;--sub:#776c5f;--line:#d8cbb0;--shu:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;background-image:radial-gradient(rgba(120,100,60,.05) 1px,transparent 1px);background-size:6px 6px}
button,input{font-family:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom) + 30px)}
header{position:sticky;top:0;z-index:5;background:rgba(243,236,220,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 0 10px}
h1{font-size:20px;letter-spacing:.15em;margin:4px 0 4px;text-align:center;font-weight:800}
.inrow{display:flex;gap:8px;align-items:center}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:none;background:var(--card);padding:10px 10px;font-size:14px;font-weight:700}
.seg button.on{background:var(--ink);color:var(--paper)}
#yin{flex:1;min-width:0;font-size:24px;font-weight:800;text-align:right;padding:6px 10px;border:1.5px solid var(--ink);border-radius:10px;background:#fffaf0}
.nen{font-weight:800;font-size:18px}
#go{border:none;background:var(--shu);color:#fff;border-radius:10px;padding:11px 14px;font-weight:800;font-size:15px}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.steps button{border:1px solid var(--ink);background:var(--card);border-radius:8px;padding:7px 0;font-size:13px;font-weight:700}
#sl{width:100%;margin:10px 0 2px;accent-color:var(--shu)}
.slab{display:flex;justify-content:space-between;font-size:10px;color:var(--sub)}
.flt{display:flex;gap:6px;margin-top:8px}
.flt button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 0;font-size:12px;font-weight:700;color:var(--sub)}
.flt button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.below{padding-top:10px}
.quick{display:flex;gap:6px;overflow-x:auto;margin:12px 0 4px;padding-bottom:4px;scrollbar-width:none}
.quick button{flex:none;border:1px dashed var(--sub);background:transparent;border-radius:16px;padding:5px 10px;font-size:12px;color:var(--sub)}
.top{text-align:center;margin:14px 0 12px}
.bigy{font-size:40px;font-weight:900;letter-spacing:.04em}
.sub{font-size:12px;color:var(--sub);margin-top:2px}
.world{margin-top:12px;background:var(--card);border:1.5px solid var(--ink);border-radius:12px;padding:12px 14px;text-align:left}
.wl{font-size:11px;font-weight:800;color:var(--shu);letter-spacing:.1em}
.wn{font-size:18px;font-weight:900;margin:2px 0 4px}
.ws{font-size:14px;line-height:1.75}
.exactbox{background:#fff5ec;border:1.5px solid var(--shu);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.xr{font-size:14px;line-height:1.6;margin-top:6px}
.tag{display:inline-block;color:#fff;font-size:10px;font-weight:800;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.reg{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--rc);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.reg h2{margin:0 0 8px;font-size:16px;color:var(--rc);letter-spacing:.08em}
.era{margin-bottom:8px}
.era .en{font-weight:900;font-size:16px}
.era .ey{font-size:11px;color:var(--sub);font-weight:600;margin-left:8px}
.era .es{font-size:13.5px;line-height:1.7;margin-top:2px}
.era.none{font-size:12px;color:var(--sub)}
.evs{border-top:1px dashed var(--line);padding-top:6px}
.ev{display:grid;grid-template-columns:auto 1fr;column-gap:8px;padding:5px 0;font-size:13.5px;line-height:1.55;border-bottom:1px dotted #e6dcc6}
.ev:last-child{border-bottom:none}
.ey2{font-weight:800;white-space:nowrap;font-size:12.5px;color:var(--rc)}
.et{grid-column:2}
.er{grid-column:2;font-size:11px;color:var(--sub)}
.ev.c .et::before{content:"文化";font-size:9.5px;border:1px solid var(--sub);color:var(--sub);border-radius:3px;padding:0 3px;margin-right:5px;vertical-align:1px}
.ev.exact{background:#fff1e6;margin:0 -8px;padding:5px 8px;border-radius:6px}
.ev.exact .er{color:var(--shu);font-weight:800}
.farnote{font-size:11.5px;color:var(--sub);border-top:1px dashed var(--line);padding-top:6px}
.ppl{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;font-size:13px;line-height:1.9}
.pl{display:block;font-size:11px;font-weight:800;color:var(--sub)}
.pp{display:inline-block;margin-right:10px}
.pp small{color:var(--sub);font-size:11px}
.foot{font-size:11px;color:var(--sub);line-height:1.7;margin:14px 2px}
.srch{position:relative;margin:6px 0 4px}
#q{width:100%;font-size:16px;padding:9px 36px 9px 12px;border:1.5px solid var(--ink);border-radius:10px;background:#fffaf0;-webkit-appearance:none}
#qx{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:transparent;font-size:18px;color:var(--sub);padding:4px 8px;display:none}
.sres{background:var(--card);border:1.5px solid var(--ink);border-radius:12px;padding:10px 12px;margin:8px 0 14px}
.sres .wl{margin-bottom:4px}
.sr{display:block;width:100%;text-align:left;border:none;border-bottom:1px dotted #e6dcc6;background:transparent;padding:7px 0;font-size:13.5px;line-height:1.55}
.sr mark,.srow mark{background:#ffe08a;color:inherit;padding:0 1px;border-radius:2px}
.sr .sy{font-weight:800;font-size:12.5px;margin-right:6px;white-space:nowrap}
.srow{border-bottom:1px dotted #e6dcc6;padding:7px 0;font-size:13.5px;line-height:1.55}
.prs{display:flex;gap:6px;margin-top:4px}
.prs button{border:1px solid var(--ink);background:#fffaf0;border-radius:14px;padding:3px 10px;font-size:11.5px;font-weight:700}
#q::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.snote{font-size:11.5px;color:var(--sub);margin-top:6px}
</style>
</head>

 <div class="seg"><button id="bc">紀元前</button><button id="ad">紀元後</button></div>

</div></header>
<div class="wrap">
<div class="below"><h1>その頃、世界では</h1>
<input type="range" id="sl" min="-3000" max="2026" step="1" aria-label="年のスライダー">
<div class="slab"><span>前3000</span><span>前1500</span><span>1</span><span>1000</span><span>2026</span></div>

<div id="sres"></div>
<div id="out"></div>
</div>

/* ====== 年の扱い ====== */
const MIN_Y=-3000,MAX_Y=2026,NOW_Y=2026;
function fmt(y,short){if(y<0)return (short?'前':'紀元前')+(-y)+'年';return y+'年';}
function century(y){if(y<0)return '紀元前'+Math.ceil(-y/100)+'世紀';return Math.ceil(y/100)+'世紀';}
function span(a,b){/* aからbまでの年数（0年がないことを考える） */let d=b-a;if(a<0&&b>0)d-=1;if(b<0&&a>0)d+=1;return d;}
function rel(evY,y){const d=span(y,evY);if(d===0)return 'この年';return d<0?(-d)+'年前':d+'年後';}
function win(y){return y<-1000?300:y<0?150:y<1500?80:y<1800?40:y<1900?20:12;}
function evLabel(e){return fmt(e[0],true)+(e[3]?'ごろ':'');}
function eraOf(list,y){/* 切り替わりの年は前後両方の時代を出す */return list.filter(e=>e[0]<=y&&y<=e[1]);}
function esc(s){return s;}

/* ====== 状態 ====== */
let Y=1600,F='all';
try{const v=localStorage.getItem('sonokoro-year');if(v!==null&&!isNaN(+v))Y=+v;const f=localStorage.getItem('sonokoro-filter');if(f)F=f;}catch(e){}
function persist(){try{localStorage.setItem('sonokoro-year',Y);localStorage.setItem('sonokoro-filter',F);}catch(e){}}
function clampY(y){y=Math.round(y);if(y===0)y=1;return Math.max(MIN_Y,Math.min(MAX_Y,y));}
function setY(y){Y=clampY(y);persist();render();}
function step(d){/* 0年を飛ばして進める */let y=Y+d;if(Y>0&&y<=0)y-=1;else if(Y<0&&y>=0)y+=1;setY(y);}

/* ====== 描画 ====== */
const out=document.getElementById('out');
function catOk(e){return F==='all'||e[2]===F;}
function regionCard(R){
 const eras=eraOf(R.eras,Y);
 const w=win(Y);
 let near=R.ev.filter(e=>catOk(e)&&Math.abs(span(Y,e[0]))<=w);
 near=near.sort((a,b)=>Math.abs(span(Y,a[0]))-Math.abs(span(Y,b[0]))).slice(0,12).sort((a,b)=>a[0]-b[0]);
 let far='';
 if(!near.length){
  const pool=R.ev.filter(catOk);
  const before=pool.filter(e=>e[0]<=Y).pop(),after=pool.find(e=>e[0]>Y);
  const two=[before,after].filter(Boolean);
  if(two.length) far='<div class="farnote">近い年の出来事は登録されていません。前後で一番近いもの：</div>'+two.map(evRow).join('');
 }
 const ppl=PEOPLE.filter(p=>p[3]===R.id&&p[1]<=Y&&Y<=p[2]);
 let h=`<section class="reg" style="--rc:${R.color}"><h2>${R.name}</h2>`;
 if(eras.length) h+=eras.map(e=>`<div class="era"><div class="en">${e[1]>=9999?e[2]:e[2]}<span class="ey">${fmt(e[0],true)}〜${e[1]>=9999?'':fmt(e[1],true)}</span></div><div class="es">${e[3]}</div></div>`).join('');
 else h+='<div class="era none">この年代のこの地域については、ここでは時代の区分を載せていません。</div>';
 if(near.length) h+='<div class="evs">'+near.map(evRow).join('')+'</div>';
 else h+=far;
 if(ppl.length) h+='<div class="ppl"><span class="pl">この年に生きていた人</span>'+ppl.map(p=>`<span class="pp">${p[0]}<small>（${ageTxt(p)}・${p[4]}）</small></span>`).join('')+'</div>';
 return h+'</section>';
}
function ageTxt(p){const a=span(p[1],Y);return (p[5]?'およそ':'')+a+'歳';}
function evRow(e){
 const exact=e[0]===Y;
 return `<div class="ev ${exact?'exact':''} ${e[2]}"><span class="ey2">${evLabel(e)}</span><span class="et">${e[1]}</span><span class="er">${rel(e[0],Y)}</span></div>`;
}
function render(){
 const inp=document.getElementById('yin'),bc=document.getElementById('bc'),ad=document.getElementById('ad'),sl=document.getElementById('sl');
 if(document.activeElement!==inp) inp.value=Math.abs(Y);
 bc.classList.toggle('on',Y<0);ad.classList.toggle('on',Y>0);
 sl.value=Y;
 document.querySelectorAll('.flt button').forEach(b=>b.classList.toggle('on',b.dataset.f===F));
 const Ws=eraOf(WORLD,Y);
 const jps=eraOf(REGIONS[0].eras,Y);
 const ago=span(Y,NOW_Y);
 let h=`<div class="top"><div class="bigy">${fmt(Y)}</div><div class="sub">${century(Y)}　・　今から約${ago.toLocaleString()}年前${jps.length?'　・　日本は'+jps.map(e=>e[2]).join(' → '):''}</div>`;
 if(Ws.length) h+=`<div class="world"><div class="wl">世界のようす${Ws.length>1?'（この年に移り変わり）':''}</div>`+Ws.map(W=>`<div class="wn">${W[2]}</div><div class="ws">${W[3]}</div>`).join('')+`</div>`;
 h+='</div>';
 const exact=[];REGIONS.forEach(R=>R.ev.forEach(e=>{if(e[0]===Y&&catOk(e))exact.push([R,e]);}));
 if(exact.length) h+=`<div class="exactbox"><div class="wl">${fmt(Y)}ちょうどの出来事</div>`+exact.map(([R,e])=>`<div class="xr"><span class="tag" style="background:${R.color}">${R.name}</span>${e[1]}${e[3]&&!e[1].startsWith('このころ')?'（ごろ）':''}</div>`).join('')+'</div>';
 h+=REGIONS.map(regionCard).join('');
 h+=`<div class="foot">表示している出来事は、その年の前後${win(Y)}年以内のものです（古い時代ほど幅を広げています）。「ごろ」が付く年や古い時代の年代には諸説あります。</div>`;
 out.innerHTML=h;
}

/* ====== 入力 ====== */
const inp=document.getElementById('yin');
function fromInput(){let v=parseInt(inp.value.replace(/[^0-9]/g,''),10);if(isNaN(v)||v===0)return;const neg=document.getElementById('bc').classList.contains('on');setY(neg?-v:v);}
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){fromInput();inp.blur();}});
inp.addEventListener('change',fromInput);
document.getElementById('go').addEventListener('click',()=>{fromInput();inp.blur();});
document.getElementById('bc').addEventListener('click',()=>{if(Y>0)setY(-Math.abs(Y));});
document.getElementById('ad').addEventListener('click',()=>{if(Y<0)setY(Math.abs(Y));});
document.getElementById('sl').addEventListener('input',e=>{let v=+e.target.value;if(v===0)v=1;Y=clampY(v);render();});
document.getElementById('sl').addEventListener('change',()=>persist());
document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>step(+b.dataset.step)));
document.querySelectorAll('[data-y]').forEach(b=>b.addEventListener('click',()=>{setY(+b.dataset.y);window.scrollTo({top:0,behavior:'smooth'});}));
document.getElementById('rnd').addEventListener('click',()=>{const all=[];REGIONS.forEach(R=>R.ev.forEach(e=>all.push(e[0])));setY(all[Math.floor(Math.random()*all.length)]);});
document.querySelectorAll('.flt button').forEach(b=>b.addEventListener('click',()=>{F=b.dataset.f;persist();render();}));
/* ====== 用語検索 ====== */
const qin=document.getElementById('q'),qx=document.getElementById('qx'),sres=document.getElementById('sres');
/* 表記ゆれを吸収：カタカナ→ひらがな、全角英数→半角、長音「ー」や「エイ」「キイ」「オウ」の後ろの「イ」「ウ」を無視、ヴ→ブ、ヂヅ→ジズ */
const ER='えけせてねへめれげぜでべぺぇきしちにひみりぎじびぴぃ',OR='おこそとのほもよろごぞどぼぽょぉ',UR='うくすつぬふむゆるぐずぶぷゅぅ';
const VS={'ぁ':'ば','ぃ':'び','ぇ':'べ','ぉ':'ぼ'};
function base(c){c=c.toLowerCase();if(c>='ァ'&&c<='ヶ')c=String.fromCharCode(c.charCodeAt(0)-0x60);if(/[Ａ-Ｚａ-ｚ０-９]/.test(c))c=String.fromCharCode(c.charCodeAt(0)-0xFEE0).toLowerCase();return c;}
function pieces(text){/* 元の1文字ごとに、検索用の文字を対応させる */
 const ch=[...text],b=ch.map(base),out=[];
 for(let i=0;i<b.length;i++){let c=b[i];const p=i>0?b[i-1]:'';
  if(/[・\s　「」『』（）()、。ー〜\-＝=]/.test(c)){out.push('');continue;}
  if(c==='ゔ'){if(VS[b[i+1]]){out.push(VS[b[i+1]]);out.push('');i++;continue;}out.push('ぶ');continue;}
  if(c==='い'&&ER.includes(p)){out.push('');continue;}
  if(c==='う'&&(OR.includes(p)||UR.includes(p))){out.push('');continue;}
  if(c==='ぢ')c='じ';if(c==='づ')c='ず';
  out.push(c);}
 return out;}
function norm(t){return pieces(t).join('');}
function hl(text,words){/* 一致した部分に印を付ける */
 const ch=[...text],n=pieces(text),marks=new Array(ch.length).fill(false);
 words.forEach(w=>{for(let i=0;i<n.length;i++){if(!n[i])continue;let k=i,acc='';while(k<n.length&&acc.length<w.length){acc+=n[k];k++;}if(acc===w)for(let j=i;j<k;j++)marks[j]=true;}});
 let h='',on=false;ch.forEach((c,i)=>{if(marks[i]&&!on){h+='<mark>';on=true;}if(!marks[i]&&on){h+='</mark>';on=false;}h+=c;});if(on)h+='</mark>';return h;}
function escH(t){return t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let SR=[];
function doSearch(){
 const raw=qin.value.trim();qx.style.display=raw?'block':'none';
 if(!raw){sres.innerHTML='';SR=[];return;}
 const words=raw.split(/[\s　]+/).map(norm).filter(Boolean);
 if(!words.length){sres.innerHTML='';return;}
 const ok=t=>{const n=norm(t);return words.every(w=>n.includes(w));};
 const evs=[];REGIONS.forEach(R=>R.ev.forEach(e=>{if(ok(e[1]))evs.push([R,e]);}));
 evs.sort((a,b)=>a[1][0]-b[1][0]);
 const ppl=PEOPLE.filter(p=>ok(p[0]+p[4]));
 const eras=[];REGIONS.forEach(R=>R.eras.forEach(e=>{if(ok(e[2]))eras.push([R,e]);}));WORLD.forEach(e=>{if(ok(e[2]))eras.push([{name:'世界',color:'#2a2521'},e]);});
 SR=[];
 let h=`<div class="sres"><div class="wl">「${escH(raw)}」の検索結果　出来事${evs.length}件・人物${ppl.length}人${eras.length?'・時代'+eras.length+'件':''}</div>`;
 if(!evs.length&&!ppl.length&&!eras.length) h+='<div class="snote">見つかりませんでした。言葉を短くするか、別の言い方で試してください。</div>';
 eras.forEach(([R,e])=>{SR.push(e[0]);h+=`<button class="sr" data-i="${SR.length-1}"><span class="tag" style="background:${R.color}">${R.name}</span><span class="sy">${fmt(e[0],true)}〜${e[1]>=9999?'':fmt(e[1],true)}</span>${hl(e[2],words)}</button>`;});
 const MAXE=100;
 evs.slice(0,MAXE).forEach(([R,e])=>{SR.push(e[0]);h+=`<button class="sr" data-i="${SR.length-1}"><span class="tag" style="background:${R.color}">${R.name}</span><span class="sy" style="color:${R.color}">${evLabel(e)}</span>${hl(e[1],words)}</button>`;});
 if(evs.length>MAXE) h+=`<div class="snote">出来事は年の古い順に${MAXE}件まで表示しています。スペースで区切って言葉を足すと絞り込めます。</div>`;
 ppl.forEach(p=>{const R=REGIONS.find(r=>r.id===p[3]);SR.push(p[1]);const b=SR.length-1;SR.push(p[2]);const d=SR.length-1;
  h+=`<div class="srow"><span class="tag" style="background:${R?R.color:'#777'}">${R?R.name:''}</span><b>${hl(p[0],words)}</b><small style="color:var(--sub)">（${p[5]?'およそ':''}${fmt(p[1],true)}〜${fmt(p[2],true)}・${hl(p[4],words)}）</small><div class="prs"><button data-i="${b}">生まれた年へ</button><button data-i="${d}">亡くなった年へ</button></div></div>`;});
 h+='<div class="snote">タップするとその年へ移動します。</div></div>';
 sres.innerHTML=h;
}
qin.addEventListener('input',doSearch);
qin.addEventListener('keydown',e=>{if(e.key==='Enter')qin.blur();});
qx.addEventListener('click',()=>{qin.value='';doSearch();qin.focus();});
sres.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;setY(SR[+b.dataset.i]);qin.value='';doSearch();window.scrollTo({top:0,behavior:'smooth'});});
render();
</script>
</body>
